[package]
name = "milk-crate"
version = "0.1.0"
description = "Milk Crate — artist-forward, nonprofit music streaming"
authors = ["Bowen"]
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "milk_crate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset lets the webview play audio files from the listener's disk.
# macos-private-api: lets the window be transparent (frosted glass) on macOS.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
# milkcrate:// share links open the app on that album, artist or scene.
tauri-plugin-deep-link = "2"
# Auto-update from GitHub Releases (signed), and restarting after an update.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CD ripping: reading the disc, MusicBrainz lookup, FLAC with tags and cover (./cdrip, tested on its own).
cdrip = { path = "cdrip" }
# Sending ripped CDs to your other computer on the same network (./cdlink, tested on its own).
cdlink = { path = "cdlink" }
# The sign-in session is kept encrypted; its key lives in Windows Credential Manager / the macOS Keychain (src/secure.rs).
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
chacha20poly1305 = "0.10"

# Opening a share link while Milk Crate is already running hands it to that window instead of opening a second one.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Windows: color the title bar to match the app (otherwise Windows may paint it the system accent color, usually blue).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
