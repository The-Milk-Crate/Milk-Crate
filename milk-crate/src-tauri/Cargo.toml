[package]
name = "milk-crate"
version = "0.1.0"
description = "Milk Crate — artist-forward, nonprofit music streaming"
authors = ["Bowen"]
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "milk_crate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset lets the webview play audio files from the listener's disk.
# macos-private-api: lets the window be transparent (frosted glass) on macOS.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
# Auto-update from GitHub Releases (signed), and restarting after an update.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
